[project]
name = "wolfvision-tools"
version = "0.1.0"
description = "Host test automation and analysis tools for Wolfvision"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "build-*", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "clang-format>=23.1.3",
    "clang-tidy>=22.1.8",
    "ruff>=0.17.0",
]
